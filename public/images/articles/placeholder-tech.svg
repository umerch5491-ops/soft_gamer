<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B12"/>
      <stop offset="50%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#171C2B"/>
    </linearGradient>
    <linearGradient id="tech-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#272B3A" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#tech-bg)"/>
  <rect width="1200" height="675" fill="url(#grid-pattern)"/>
  <circle cx="600" cy="337" r="240" fill="#8B5CF6" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="750" cy="280" r="180" fill="#38BDF8" fill-opacity="0.06" filter="blur(50px)"/>
  
  <!-- Geometric Graphic Elements -->
  <g transform="translate(600, 337)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="url(#tech-glow)" stroke-width="2.5" opacity="0.8"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#171C2B" stroke="#272B3A" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="28" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M -40 0 L 40 0 M 0 -40 L 0 40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Editorial Watermark -->
  <text x="60" y="615" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="2">SOFT GAMER</text>
  <text x="220" y="615" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#A1A1AA" letter-spacing="1">| TECHNICAL ARCHITECTURE</text>
</svg>

