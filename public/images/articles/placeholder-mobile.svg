      <stop offset="60%" stop-color="#0A181C"/>
      <stop offset="100%" stop-color="#171C2B"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
