  <text x="600" y="345" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="3">MOBILE &amp; HANDHELD</text>
  <text x="600" y="375" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle" letter-spacing="2">PORTABLE SILICON REVOLUTION</text>

  <text x="60" y="615" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="2">SOFT GAMER</text>
