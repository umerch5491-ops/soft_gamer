  </defs>
  <rect width="1200" height="675" fill="url(#mobile-bg)"/>
  
  <!-- Handheld device frame -->
  <rect x="360" y="167" width="480" height="340" rx="40" fill="#171C2B" stroke="url(#emerald-glow)" stroke-width="2.5"/>
  <rect x="420" y="200" width="360" height="274" rx="16" fill="#090B12" stroke="#272B3A" stroke-width="1.5"/>
  
