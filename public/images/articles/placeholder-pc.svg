<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="pc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B12"/>
      <stop offset="40%" stop-color="#0F1424"/>
      <stop offset="100%" stop-color="#171C2B"/>
    </linearGradient>
    <linearGradient id="pc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#pc-bg)"/>
  
  <!-- Circuit tracks -->
  <g stroke="#272B3A" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100 200 L 300 200 L 400 300 L 700 300 L 750 250 L 900 250"/>
    <path d="M 200 500 L 450 500 L 550 400 L 800 400 L 950 550"/>
    <circle cx="900" cy="250" r="6" fill="#38BDF8"/>
    <circle cx="200" cy="500" r="6" fill="#8B5CF6"/>
    <circle cx="800" cy="400" r="6" fill="#38BDF8"/>
  </g>

  <!-- Central Die / Processor Silhouette -->
  <rect x="475" y="212" width="250" height="250" rx="16" fill="#171C2B" stroke="url(#pc-accent)" stroke-width="2.5"/>
  <rect x="515" y="252" width="170" height="170" rx="10" fill="#111522" stroke="#272B3A" stroke-width="1.5"/>
  <text x="600" y="347" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="4">PC HARDWARE</text>
  <text x="600" y="377" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="2">BENCHMARKS &amp; LATENCY</text>

  <text x="60" y="615" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="2">SOFT GAMER</text>
  <text x="220" y="615" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#A1A1AA" letter-spacing="1">| PC EDITORIAL</text>
</svg>

