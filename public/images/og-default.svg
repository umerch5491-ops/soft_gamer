<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B12"/>
      <stop offset="40%" stop-color="#111522"/>
      <stop offset="100%" stop-color="#171C2B"/>
    </linearGradient>
    <linearGradient id="og-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <circle cx="950" cy="200" r="300" fill="#8B5CF6" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="200" cy="450" r="250" fill="#38BDF8" fill-opacity="0.08" filter="blur(70px)"/>

  <rect x="80" y="80" width="1040" height="470" rx="20" fill="none" stroke="#272B3A" stroke-width="2"/>

  <text x="140" y="220" font-family="system-ui, sans-serif" font-size="56" font-weight="900" fill="url(#og-gradient)" letter-spacing="4">SOFT GAMER</text>
  <text x="140" y="270" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38BDF8" letter-spacing="3">PREMIUM GAMING MAGAZINE &amp; EDITORIAL</text>
  
  <text x="140" y="340" font-family="system-ui, sans-serif" font-size="24" font-weight="400" fill="#F8FAFC">
    In-depth gaming news, hardware breakdowns, competitive guides &amp; reviews.
  </text>
  <text x="140" y="380" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#A1A1AA">
    Built for international enthusiasts prioritizing performance and analytical integrity.
  </text>

  <g transform="translate(140, 440)">
    <rect x="0" y="0" width="140" height="38" rx="6" fill="#171C2B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="70" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">NEWS &amp; TECH</text>

    <rect x="155" y="0" width="140" height="38" rx="6" fill="#171C2B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="225" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">PC &amp; CONSOLE</text>

    <rect x="310" y="0" width="140" height="38" rx="6" fill="#171C2B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="380" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">GUIDES</text>

    <rect x="465" y="0" width="140" height="38" rx="6" fill="#171C2B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="535" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" text-anchor="middle">CRITIQUES</text>
  </g>
</svg>

